name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.23
      - name: Reproduce locked setup
        run: python scripts/setup.py
      - name: Python checks
        run: uv run ruff check backend tests scripts
      - name: Python format
        run: uv run ruff format --check backend tests scripts
      - name: Frontend format
        run: npm run format:check --prefix frontend
      - name: Install test browser (not an AI model)
        run: uv run playwright install --with-deps chromium
      - name: Integration and browser tests
        run: uv run pytest -q -o faulthandler_timeout=30
