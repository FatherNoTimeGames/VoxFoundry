[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "voxfoundry"
version = "0.1.0.dev0"
description = "Local-first audiobook production studio"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "filelock==4.2.4",
    "platformdirs==4.14.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[project.scripts]
voxfoundry = "voxfoundry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/voxfoundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "playwright==1.64.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]
